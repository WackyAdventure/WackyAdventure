- type: entity
  id: AnomalyPyroclasticBuffed
  parent: BaseAnomaly
  suffix: Pyroclastic
  components:
  - type: AmbientSound
    volume: 5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Anomaly
    minPointsPerSecond: 30
    maxPointsPerSecond: 140
    corePrototype: AnomalyCorePyroclastic
    coreInertPrototype: AnomalyCorePyroclasticInert
    supercriticalSoundAtAnimationStart:
      collection: AnomalyPyroSupercritical
  - type: Sprite
    sprite: Structures/Specific/Anomalies/pyro_anom.rsi
    layers:
    - state: anom
      map: ["enum.AnomalyVisualLayers.Base"]
    - state: pulse
      map: ["enum.AnomalyVisualLayers.Animated"]
      visible: false
  - type: PointLight
    radius: 12.0
    energy: 15.0
    color: "#E25822"
    castShadows: false
  - type: PyroclasticAnomaly
  - type: TempAffectingAnomaly
    tempChangePerSecond: 75
    hotspotExposeTemperature: 1000
  - type: GasProducerAnomaly
    releasedGas: 5
    releaseOnMaxSeverity: true
    spawnRadius: 4
    tileCount: 5
    tempChange: 420
  - type: ProjectileAnomaly
    projectilePrototype: ProjectileAnomalyFireballBuffed
    projectileSpeed: 5
    minProjectiles: 7
    maxProjectiles: 15
  - type: IgnitionSource
    temperature: 1200
    ignited: true
  - type: IgniteOnCollide
    fixtureId: fix1
    fireStacks: 3
  - type: DamageOnInteract
    damage:
      types:
        Heat: 15
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Heat: 20
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
    behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          BulletGrenadeBlast:
            min: 1
            max: 2
  - type: Construction
    deconstructionTarget: null
    graph: AnomalyBuffPyro
    node: pyroanomaly_buffed

