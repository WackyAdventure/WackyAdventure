- type: entity
  id: NukeLathe
  parent: [BaseLatheLube, BaseSiloUtilizer] # Goob edit
  name: ЯдерЛат
  description: Позволяет производить операции с радиоактивными веществами.
  components:
  - type: Sprite
    sprite: _WackyAdventure/Structures/Machines/nukelathe.rsi
    state: base_1
    snapCardinals: true
  - type: Machine
    board: NukeLatheMachineCircuitboard
  - type: MaterialStorage
 #   whitelist:
 #     tags:
 #       - SheetUranium-235
 #       - SheetUranium-238
 #       - Uranium
 #       - SheetLitium
 #       - SheetFluorite
 #       - Sheetneptunium
 #       - SheetPlutonium-238
 #       - SheetPlutonium-239
 #       - SheetPlutonium-240
 #       - SheetPlutonium
  - type: Lathe
    idleState: icon
    unlitIdleState: unlit
    dynamicPacks:
    - BaseNuclear
    - NeptuniumSynthesis
    - PlutoniumSynthesis
    - MOXFuel

- type: entity
  id: Weaponlathe
  parent: [BaseLatheLube, BaseSiloUtilizer] # Goob edit
  name: ОружЛат
  description: Высокотехнологичный станок для создания стрелкового оружия.
  components:
  - type: Sprite
    sprite: _WackyAdventure/Structures/Machines/weaponlath.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: WeaponatheMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - 
#  - type: EmagLatheRecipes
#    emagStaticPacks:
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
